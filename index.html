<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Amira 🤍 | by Fahril MOONSTAR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Orbitron', 'Rajdhani', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #05071a 0%, #101435 50%, #1a1540 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === Grid Latar Cyberpunk === */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        /* === Partikel Melayang === */
        .partikel {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            opacity: 0;
            animation: naik 8s ease-in-out infinite;
        }

        @keyframes naik {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
        }

        /* === Konten Utama === */
        .konten {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 50px;
            background: rgba(10, 12, 30, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.15),
                inset 0 0 40px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            max-width: 90%;
        }

        .konten::before,
        .konten::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #ff2e88;
        }

        .konten::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .konten::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff;
            letter-spacing: 3px;
        }

        .heart {
            color: #ff2e88;
            text-shadow: 
                0 0 10px #ff2e88,
                0 0 20px #ff2e88;
        }

        .sub-teks {
            color: #b0b0d0;
            font-size: 1.1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .credit {
            font-size: 0.9rem;
            color: #00ffff;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .credit span {
            color: #ff2e88;
            font-weight: bold;
        }

        /* === Efek Kedipan Neon === */
        .kedip {
            animation: kedip 2s ease-in-out infinite alternate;
        }

        @keyframes kedip {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        /* === Garis Scan === */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Garis Scan -->
    <div class="scan-line"></div>

    <!-- Grid Latar -->
    <div class="grid-bg"></div>

    <!-- Partikel Melayang -->
    <div class="partikel" style="left: 15%; animation-delay: 0s;"></div>
    <div class="partikel" style="left: 25%; animation-delay: 1.2s; background: #ff2e88; box-shadow: 0 0 10px #ff2e88;"></div>
    <div class="partikel" style="left: 40%; animation-delay: 0.5s;"></div>
    <div class="partikel" style="left: 55%; animation-delay: 2s; background: #ff2e88; box-shadow: 0 0 10px #ff2e88;"></div>
    <div class="partikel" style="left: 70%; animation-delay: 1s;"></div>
    <div class="partikel" style="left: 85%; animation-delay: 1.8s;"></div>
    <div class="partikel" style="left: 8%; animation-delay: 2.5s; background: #ff2e88; box-shadow: 0 0 10px #ff2e88;"></div>
    <div class="partikel" style="left: 92%; animation-delay: 0.8s;"></div>

    <!-- Konten Utama -->
    <div class="konten kedip">
        <h1>Untuk Amira <span class="heart">🤍</span></h1>
        <p class="sub-teks">Selamanya & Selalu — Di Masa Depan dan Di Hati</p>
        <p class="credit">Developed with <span>❤</span> by <span>Fahril MOONSTAR</span></p>
    </div>

</body>
</html>
